<!DOCTYPE html>

<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0d6efd"
    >

    <title>GDS - Offline</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            font-family:
                Arial,
                sans-serif;

            background: #f5f7fa;

            padding: 20px;

            text-align: center;
        }

        .offline-box {

            max-width: 420px;

            background: white;

            padding: 30px;

            border-radius: 18px;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,.10);
        }

        .offline-icon {

            font-size: 60px;

            margin-bottom: 15px;
        }

        h1 {

            margin: 0 0 10px;

        }

        p {

            color: #666;

            line-height: 1.6;

        }

        button {

            border: none;

            background: #0d6efd;

            color: white;

            padding: 12px 20px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 15px;
        }

    </style>

</head>

<body>

    <div class="offline-box">

        <div class="offline-icon">
            📡
        </div>

        <h1>
            Tidak Ada Koneksi
        </h1>

        <p>
            Aplikasi GDS membutuhkan
            koneksi internet untuk
            mengambil dan menyimpan
            data pelanggaran siswa.
        </p>

        <button
            onclick="location.reload()"
        >
            Coba Lagi
        </button>

    </div>

</body>

</html>
